description:
  de: "Erfassung der wesentlichen Aspekte des Bestandes mithilfe der Grundlagen der FZAG. Überführung in ein Bestandsmodell (IFC) bestehend aus: \n-Digitales Geländemodell (DGM) - wird durch die Werkleitungskoordination\
    \ geliefert \n-Geologiemodell (Darstellung der geologischen Schichten aufgrund von Resultaten aus Bohrkernen und Sondagen) \n-swissBuildings3D vom Swisstopo \n-3D Gebäude FZAG \n-Strassenkörper (Darstellung\
    \ Kofferung; Trag-, Binder, Deckschicht; Bankett), PAK-haltige Schichten, Randabschlüsse \n-Grenzen (inkl. Baustellenabgrenzung/Sperrzonen, Baustellenabschrankung) \n-Werkleitungen & Kanalisation FZAG\
    \ \n-Darstellung Eigentum Dritte: Abwasser, Trinkwasser (inkl. Hydranten), Beleuchtung (inkl. Kandelaber), Gas, Fernwärme, EW, Swisscom, weitere Anbieter -Kunstbauten (Brücken, Stützwände, etc.) -Bewuchs,\
    \ Bepflanzungen, Mulde"
