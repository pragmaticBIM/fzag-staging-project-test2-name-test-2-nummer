  de: "Elementbasierte Modellierung der Volumenkörper und geometrischen Elemente gemäss Anforderungen des EIR und FDK und Flughafen-Normalien\n-Alle Elemente müssen geschlossenen Volumenkörpern entsprechen\
    \ und die Modellanforderungen berücksichtigen. \n-Alle für die Ausschreibung relevanten Elemente sind zu modellieren und gemäss dem EIR zu attribuieren. \n-Mengeneinheiten müssen mit dem Leistungsverzeichnis\
    \ kongruent sein \n-Objekte sind nach Bauphasen zugeordnet\n-Baustellen-Abschrankung und Abgrenzungen/Sperrzonen (Tag/-Nachtarbeit) gemäss Angaben Flight Ops sind im Modell ersichtlich"
