description:
  de: "Die beteiligten Planer arbeiten eng und koordiniert zusammen.\nSie haben Kollisionsprüfungen durchzuführen. Ebenso ist die Erfüllung der weiteren Informationsanforderungen gemäss EIR zu überprüfen\
    \ (Attributierung, Formate, Weiterverarbeitung der Daten etc.). \nProzesse für das Vorgehen bei Nichterfüllung sowie Soft- (Lichtraumprofil, Schleppkurve, Sichtweiten, Sicherheitsaspekte) und Hard Clashes\
    \ (Volumenüberschneidung, Sperrzonen) sind zu erstellen und zu befolgen.  \nDem Bauherren ist ein Qualitätsprüfungsbericht und Kollisionsprüfungsnachweis zu liefern, anhand dem er die Zusammenarbeit\
    \ verfolgen und die Qualität der Planung überprüfen kann."
