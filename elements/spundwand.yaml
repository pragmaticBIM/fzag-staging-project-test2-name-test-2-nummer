id: fzag:element/spundwand
sort_order: 39
status: active
name:
  de: Spundwand
  fr: ''
  it: ''
  en: ''
needed_in_domain:
- fzag:domain/bauhindernisse
definition:
  de: Eine Spundwand ist ein linear angeordnetes, in den Boden eingebrachtes Verbau‑ oder Stützbauwerk, das aus einzelnen oder zusammengesetzten Spundbohlen besteht. Sie dient der Sicherung von Baugruben,
    Böschungen oder Uferbereichen und nimmt Erd‑ und Wasserdruck auf. Spundwände können freistehend, ausgesteift oder rückverankert sein und bleiben bei dauerhaften Anwendungen dauerhaft im Boden.
  fr: ''
  it: ''
  en: ''
