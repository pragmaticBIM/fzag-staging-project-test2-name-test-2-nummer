definition:
  de: Eine Halbschale ist ein längs halbiertes Rohr, das zur Auskleidung oder Ausbildung von Gerinnen, Rinnen oder Sohlen in Entwässerungsanlagen eingesetzt wird. Sie dient dazu, Wasser gezielt zu führen,
    Abflusswege zu stabilisieren und Erosion zu verhindern.
