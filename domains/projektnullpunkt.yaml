definition:
  de: 'Bei Projektbeginn ist ein Projektnullpunkt (PNP) unter Berücksichtigung der Nordrichtung zu definieren. Zur eindeutigen Definition sind DREI Einfüge-Punkte (Form: vierseitige, auf den Kopf gestellte
    Pyramiden) in jedem Fachmodell hinzuzufügen. Der Projektnullpunkt (Global Offset) wird durch den Auftragnehmer definiert und muss nahe dem geometrischen Mittelpunkt des Projektes gewählt und konsequent
    in allen Fachmodellen angewendet werden.

    Koordinatensystem: LV95/LN02'
